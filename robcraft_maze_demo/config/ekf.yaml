ekf_filter_node:
  ros__parameters:
    qos_overrides./odometry/filtered.publisher.reliability: reliable

    use_sim_time: False

    two_d_mode: true

    print_diagnostics: true
    debug: false

    permit_corrected_publication: false
    publish_acceleration: false
    publish_tf: true

    frequency: 30.0

    map_frame: map
    odom_frame: /robot_george_1/odom
    base_link_frame: /robot_george_1/base_footprint
    # world_frame == odom_frame: the EKF owns the odom -> base_footprint TF only;
    # RTAB-Map publishes the map -> odom TF (no competing map -> odom publisher).
