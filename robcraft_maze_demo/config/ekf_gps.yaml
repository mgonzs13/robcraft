imu_filter_madgwick_node:
  ros__parameters:
    use_sim_time: false
    use_mag: true
    world_frame: enu
    fixed_frame: robot_george_1/odom
    publish_tf: false
    gain: 0.1
    zeta: 0.0
    orientation_stddev: 0.01

navsat_transform_node:
  ros__parameters:
    frequency: 30.0
    use_sim_time: false
    delay: 3.0
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true
    broadcast_cartesian_transform: true
    publish_filtered_gps: false
    use_odometry_yaw: true
    wait_for_datum: false

